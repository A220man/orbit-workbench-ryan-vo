services:
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin_password_change_me
    volumes:
      - keycloak-data:/opt/keycloak/data
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "exec", "3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      ENVIRONMENT: development
      HOST: "0.0.0.0"
      PORT: 8000
      DATABASE_URL: "sqlite:////app/data/orbit.db"
      DEMO_MODE: "true"
      OIDC_ISSUER_URL: "http://127.0.0.1:8080/realms/orbit"
      OIDC_CLIENT_ID: orbit-frontend
    volumes:
      - backend-data:/app/data
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3000:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  keycloak-data:
  backend-data:
